name: Sync upstream and build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.repository == 'doveis99/Wand-Enhancer'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout master

          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git
          git fetch upstream master

          branch_changed=false
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork master already contains upstream/master."
          else
            if ! git merge --no-edit upstream/master; then
              # Resolve modify/delete conflicts for files the fork intentionally removes
              conflict_files=$(git diff --name-only --diff-filter=U)
              resolved=true
              fork_removed_pattern='^\.github/workflows/release\.'
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if echo "$file" | grep -qE "$fork_removed_pattern"; then
                  git rm --force "$file"
                  echo "Resolved conflict: removed $file (fork policy)."
                else
                  echo "::error::Unhandled merge conflict in $file"
                  resolved=false
                fi
              done < <(echo "$conflict_files")

              if [ "$resolved" = false ]; then
                echo "::error::Merge conflicts could not be resolved automatically."
                exit 1
              fi

              git commit --no-edit
            fi
            git push origin HEAD:master
            branch_changed=true
          fi

          echo "branch_changed=$branch_changed" >> "$GITHUB_OUTPUT"

      - name: Dispatch build for synced branch
        if: steps.sync.outputs.branch_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master
