name: Sync upstream and build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'doveis99/Wand-Enhancer'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream changes
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout master

          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git
          git fetch upstream master

          branch_changed=false
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork master already contains upstream/master."
          else
            git merge --no-edit upstream/master || {
              merge_status=$?
              conflicts="$(git diff --name-only --diff-filter=U)"
              allowed_conflict=".github/workflows/release.yml"
              unexpected_conflicts="$(printf '%s\n' "$conflicts" | grep -v -x "$allowed_conflict" || true)"

              if [ -n "$unexpected_conflicts" ]; then
                echo "Unexpected merge conflicts:"
                printf '%s\n' "$unexpected_conflicts"
                exit "$merge_status"
              fi

              if printf '%s\n' "$conflicts" | grep -q -x "$allowed_conflict"; then
                echo "Keeping fork-only release policy; removing upstream public release workflow."
                git rm -f "$allowed_conflict"
                git commit --no-edit
              else
                exit "$merge_status"
              fi
            }
            pwsh -NoProfile -File ./scripts/validate-fork-automation.ps1
            git push origin HEAD:master
            branch_changed=true
          fi

          echo "branch_changed=$branch_changed" >> "$GITHUB_OUTPUT"

      - name: Dispatch build for synced branch
        if: steps.sync.outputs.branch_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master
